[cf]   # This section contains the settings of the descriptor
geometry_sequence = true    # Use geometry sequence for the polynomial power
elements = ["Li", "Ta", "O", "Cl"]            # The elements included for the potential
p2 = [2, 10, 8]             # The powers for the two-body terms, from 2 to 10 with 5 polynomials
rcut2 = 5.0                 # Cut off radius for the two-body terms
rcut3 = 5.0                 # Cut off radius for the two-body terms
p3 = [2, 10, 6]             # The powers for the three-body terms, from 2 to 10 with 5 polynomials
q3 = [2, 10, 6]             # The powers for the three-body terms, from 2 to 10 with 5 polynomials

[trainer]  # This section contains the settings for the trainer, e.g. how we should train the potential
num_workers = 8     # The number of workers to use for local/non-distributed training
num_threads_per_worker = 8  # Julia threads used by each distributed training worker
nmodels = 128       # The number of model that should be build for constructing the ensemble model, use of a smaller value is also acceptable
external = true     # Distributed link workers run training in external Julia child processes
external_completion_ratio = 0.9  # Fraction of models required before distributed training stops
train_method="lm"
#batch_size=1000
log_file = "train-log"

[trainer.training_kwargs]
solver = "cg"


[scheduler]
script = "./distributed_worker_job.sh"   # Job script used to launch distributed link workers
type = "SLURM"      # Name of the queue system, at the moment only slurm is supported
njobs = 24          # Fallback array size; distributed.dft_worker_jobs/training_worker_jobs choose phase sizes
submit_jobs = true  # Let the distributed link server submit worker arrays

[distributed]
enabled = true
coordination_dir = ".eddp-distributed"
manage_worker_jobs = false
dft_worker_jobs = 24
training_worker_jobs = 8
dft_crud_workdir = "crud-work"
control_poll_interval_seconds = 10.0
worker_poll_interval_seconds = 10.0
worker_heartbeat_interval_seconds = 30.0
worker_child_grace_seconds = 300.0
worker_child_kill_seconds = 30.0
log_enabled = true
log_level = "info"
log_dir = "logs"
log_interval_seconds = 30.0

[distributed.dft_env]
OMP_NUM_THREADS = "1"

[distributed.training_env]
OMP_NUM_THREADS = "8"
JULIA_NUM_THREADS = "8"


[rss]
seedfile = "LiTaOCl-SAMPLING.cell"    #  Seedfile for random structure searching using the potential built
core_size = 0.5                # Size of the hard-core to prevent atoms from overlapping each other. Set to a value smaller than typical bond length
pressure_gpa = 0.1         # External pressure when running geometry optimisation. Set a positive value to avoid overly empty unit cells

# Formula sampling
formula_sampling_enabled = true
formula_target_atom_volumes = {"Cl" = 15, "Li"= 10, "O"=15, "Ta" = 25}
[rss.formula_oxidation_states]
Cl = [-1]
O = [-2]
Ta = [5]
Li = [1]



[state]
per_generation = 1000           # Number of structures per generation
max_iterations = 10            # Maximum number of iterations
workdir = "."                  # Working directory
seedfile_calc = "LiTaOCl.cell"       # Seed file containing the settings for running DFT calculation

dft_mode = "crud-queue"              # Use crud.pl through the queue, the other options is crud-queue which will use a job.sh file to launch crud process in the queue
n_initial = 1000                # Number of initial (generation 0) structures
shake_per_minima = 5           # Number of shaken structures generated for each (eddp) relaxed structure
mpinp = 8

[state.rss]
seedfile = ["LiTaOCl-SEARCH.cell"]     # Name of the seed for random structure generation when building the potential
nprocs = 16                # Number of processes running random structure generation and relaxation during the building process
core_size = 1.2                # Size of the hard-core to prevent atoms from overlapping each other. Set to a value smaller than typical bond length
pressure_gpa = 1.0         # External pressure when running geometry optimisation. Set a positive value to avoid overlly empty unit cells

# Formula sampling
formula_sampling_enabled = true
formula_target_atom_volumes = {"Cl" = 15, "Li"= 10, "O"=15, "Ta" = 25}

[state.rss.formula_oxidation_states]
Cl = [-1]
O = [-2]
Ta = [5]
Li = [1]


