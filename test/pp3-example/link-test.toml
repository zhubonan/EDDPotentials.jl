[state]
seedfile_calc = "Al.cell"
dft_mode = "pp3"
per_generation = 10
n_initial = 50
max_iterations = 2

[state.rss]
seedfile = "Al.cell"
external = false
# Relaxation mode: "standard" (default), "hyperspace", or "hot"
relax_mode = "standard"
# Hot-AIRSS options
hot_n_rounds = 10
hot_md_temperature = 300.0
hot_md_steps = 1000
hot_md_timestep = 0.5
hot_relax_cell = true

    [state.rss.relax]
    force_threshold = 1e-3

[cf]
elements = ["Al"]
rcut2 = 5.0
rcut3 = 5.0
p2 = [6, 18, 5]
q3 = []
p3 = []
geometry_sequence = true

[rss]
max = 100
    [rss.relax]
    force_threshold = 1e-3

[trainer]
log_file = "train-log"
training_mode = "linear"
energy_threshold = 100
nmodels = 8
n_nodes = [2]
external = true
external_mode = "local"
num_workers = 1
show_progress = false
boltzmann_kt = 5
# Training method: "lm" (default), "lm_batched", or "sgd"
train_method = "lm"
# SGD options (used when train_method = "sgd")
optimizer = "adam"
lr = 0.001
momentum = 0.9
weight_decay = 0.0
grad_clip = 1.0
batch_size = 0
